# CI — 포맷 · 린트 · 타입 검사 · 테스트 · 빌드 (architecture §7)
# DB 통합·E2E 테스트는 postgres:17 서비스 컨테이너를 쓴다 (test-plan §1). CI에서는 DB 연결 실패 = 테스트 실패.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: caddy_haru
          POSTGRES_PASSWORD: caddy_haru
          POSTGRES_DB: caddy_haru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caddy_haru"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://caddy_haru:caddy_haru@localhost:5432/caddy_haru_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: 초기 JS 크기 (NFR-002 목표 gzip 200KB 이하)
        run: |
          for f in apps/web/dist/assets/index-*.js; do
            size=$(gzip -c "$f" | wc -c)
            echo "$f gzip ${size} bytes"
            if [ "$size" -gt 204800 ]; then echo "::error::초기 JS가 gzip 200KB를 넘었습니다"; exit 1; fi
          done
